      <div class="card-body">
        <h5 class="card-title"><b>{{ data.name }}</b></h5>
        <pre class="card-text"><b>Id</b>: {{ data.id }}
<b>Price</b>: {{ data.price }}
<b>Stock</b>: {{ data.stock }}
<b>Category</b>: {{ data.category }}
<b>Rating</b>: {{ data.rating }}</pre>
        <p class="card-text"><b>Description</b>: {{ data.description }}</p>
          <div class="d-flex gap-3">
        <form action="http://127.0.0.1:8000/add_cart/{{ data.id }}" method="POST">
            {% csrf_token %}
          <button type="submit" class="btn btn-primary btn-sm">Add to Cart</button>
        </form>
          <form action="http://127.0.0.1:8000/del_product/{{ data.id }}" method="POST">
            {% csrf_token %}
          <button type="submit" class="btn btn-primary btn-sm">Delete item</button>
        </form>
              <form action="http://127.0.0.1:8000/edit_product/{{ data.id }}" method="POST">
            {% csrf_token %}
          <button type="submit" class="btn btn-primary btn-sm">Update item</button>
              </form>
          </div>
      </div>
    </div>
  </div>
    {% endfor %}
</div>
